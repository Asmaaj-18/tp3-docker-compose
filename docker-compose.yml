services:
  api:
    build: ./api
    container_name: api
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://database:27017/tp3
    depends_on:
      - database

  database:
    image: mongo:6
    container_name: database
    volumes:
      - database_data:/data/db

  client:
    build: ./client
    container_name: client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - api

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - api

volumes:
  database_data: